<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/map-tools.css">
        <script src="../assets/category-colors.js"></script>
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>Gefährdete Baudenkmale in Deutschland</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/BBL_2.js"></script>
        <script src="data/Gefhrdung_3.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:18, minZoom:5
        }).fitBounds([[46.943250920174414,5.0944148828681035],[55.25807883921146,16.042098200548917]]);
        // The iframe starts on Germany; do not restore an old hash.
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var abstract = new L.Control({'position':'bottomleft'});
        abstract.onAdd = function (map) {
            this._div = L.DomUtil.create('div',
            'leaflet-control abstract');
            this._div.id = 'abstract'
                this._div.setAttribute("onmouseenter", "abstract.show()");
                this._div.setAttribute("onmouseleave", "abstract.hide()");
                this.hide();
                return this._div;
            };
            abstract.hide = function () {
                this._div.classList.remove("abstractUncollapsed");
                this._div.classList.add("abstract");
                this._div.innerHTML = 'i'
            }
            abstract.show = function () {
                this._div.classList.remove("abstract");
                this._div.classList.add("abstractUncollapsed");
                this._div.innerHTML = '<br />Dieses WebGIS-Projekt visualisiert und analysiert 12 ausgewählte, akut gefährdete Baudenkmale in Deutschland. Auf Basis des „Schwarzbuchs der Denkmalpflege“ der Deutschen Stiftung Denkmalschutz (DSD) werden die spezifischen Gefährdungsursachen – darunter Substanzverfall, bauplanerischer Abriss und anhaltender Leerstand – räumlich verortet und thematisch differenziert dargestellt. <br /><br />Ziel der interaktiven Webkarte ist es, regionale Gefährdungsschwerpunkte im baulichen Erbe sichtbar zu machen und fundierte Fachinformationen über eine zugängliche Weboberfläche bereitzustellen.<br />';
        };
        abstract.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_CARTODarkMatter_0');
        map.getPane('pane_CARTODarkMatter_0').style.zIndex = 400;
        var layer_CARTODarkMatter_0 = L.tileLayer('https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png?key=cb1_4bfa_1_cc83b59caf38bb4857130338', {
            pane: 'pane_CARTODarkMatter_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 5,
            maxZoom: 18,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        layer_CARTODarkMatter_0;
        map.addLayer(layer_CARTODarkMatter_0);
        map.createPane('pane_CARTOPositron_1');
        map.getPane('pane_CARTOPositron_1').style.zIndex = 401;
        var layer_CARTOPositron_1 = L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_4bfa_1_cc83b59caf38bb4857130338', {
            pane: 'pane_CARTOPositron_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 5,
            maxZoom: 18,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        layer_CARTOPositron_1;
        map.addLayer(layer_CARTOPositron_1);
        function pop_BBL_2(feature, layer) {
            var popupContent = '<table>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: Math.min(650, window.innerHeight * 0.75), maxWidth: 340 });
        }

        function style_BBL_2_0() {
            return {
                pane: 'pane_BBL_2',
                opacity: 1,
                color: 'rgba(131,137,143,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fillOpacity: 0,
                interactive: false,
            }
        }
        map.createPane('pane_BBL_2');
        map.getPane('pane_BBL_2').style.zIndex = 402;
        map.getPane('pane_BBL_2').style['mix-blend-mode'] = 'normal';
        var layer_BBL_2 = new L.geoJson(json_BBL_2, {
            attribution: '',
            interactive: false,
            dataVar: 'json_BBL_2',
            layerName: 'layer_BBL_2',
            pane: 'pane_BBL_2',
            onEachFeature: pop_BBL_2,
            style: style_BBL_2_0,
        });
        bounds_group.addLayer(layer_BBL_2);
        map.addLayer(layer_BBL_2);

        function popupImageHtml(value, properties) {
            var name = String(properties.name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            var local = /schwarz.*b(?:a|ae)r/.test(name) ? 'images/schwarzer_baer.jpg' : /villa.*buth/.test(name) ? 'images/villa_buth.jpg' : '';
            var src = local || (value == null ? '' : String(value).trim());
            if (/<img\b/i.test(src)) { var doc = new DOMParser().parseFromString(src, 'text/html'); var img = doc.querySelector('img'); src = img ? img.getAttribute('src') : ''; }
            if (!src || /^(javascript|vbscript):/i.test(src)) return '';
            return '<img class="denkmal-photo" src="' + src.replace(/&/g,'&amp;').replace(/"/g,'&quot;') + '" alt="' + String(properties.name || 'Denkmal').replace(/&/g,'&amp;').replace(/"/g,'&quot;') + '" onerror="this.hidden=true;this.insertAdjacentText(&quot;afterend&quot;,&quot;Bilddatei nicht vorhanden.&quot;);">';
        }
        function pop_Gefhrdung_3(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['name'] !== null ? autolinker.link(String(feature.properties['name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['ort'] !== null ? autolinker.link(String(feature.properties['ort']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['beschreibung'] !== null ? autolinker.link(String(feature.properties['beschreibung']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['quelle_url'] !== null ? autolinker.link(String(feature.properties['quelle_url']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bild_url'] !== null ? popupImageHtml(feature.properties['bild_url'], feature.properties) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['bildnachweis'] !== null ? autolinker.link(String(feature.properties['bildnachweis']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: Math.min(650, window.innerHeight * 0.75), maxWidth: 340 });
        }

        function style_Gefhrdung_3_0(feature) {
            switch(String(feature.properties['kategorie'])) {
                case 'Abriss':
                    return {
                pane: 'pane_Gefhrdung_3',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(255,255,255,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(196,61,61,1.0)',
                interactive: true,
            }
                    break;
                case 'Hochwasser':
                    return {
                pane: 'pane_Gefhrdung_3',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(255,255,255,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(38,117,184,1.0)',
                interactive: true,
            }
                    break;
                case 'Infrastruktur':
                    return {
                pane: 'pane_Gefhrdung_3',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(255,255,255,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(22,132,120,1.0)',
                interactive: true,
            }
                    break;
                case 'Leerstand':
                    return {
                pane: 'pane_Gefhrdung_3',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(255,255,255,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(120,81,169,1.0)',
                interactive: true,
            }
                    break;
                case 'Verfall':
                    return {
                pane: 'pane_Gefhrdung_3',
                radius: 8.0,
                opacity: 1,
                color: 'rgba(255,255,255,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(185,106,20,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_Gefhrdung_3');
        map.getPane('pane_Gefhrdung_3').style.zIndex = 403;
        map.getPane('pane_Gefhrdung_3').style['mix-blend-mode'] = 'normal';
        var layer_Gefhrdung_3 = new L.geoJson(json_Gefhrdung_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Gefhrdung_3',
            layerName: 'layer_Gefhrdung_3',
            pane: 'pane_Gefhrdung_3',
            onEachFeature: pop_Gefhrdung_3,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_Gefhrdung_3_0(feature));
            },
        });
        bounds_group.addLayer(layer_Gefhrdung_3);
        map.addLayer(layer_Gefhrdung_3);
        setBounds();
        </script>        
        <script src="js/map-tools.js"></script>
        <script src="js/card-map-bridge.js"></script>
    </body>
</html>
